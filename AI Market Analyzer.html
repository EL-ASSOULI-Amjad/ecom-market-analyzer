<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI Market Analyzer</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Inter', sans-serif;
  background: #0A0E1A;
  color: rgba(255,255,255,0.87);
  overflow: hidden;
}
#root { height: 100vh; display: flex; }

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 100px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

@keyframes shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
@keyframes slideIn {
  from { opacity: 0; transform: translateX(-8px); }
  to { opacity: 1; transform: translateX(0); }
}
.fade-up { animation: fadeUp 0.4s ease both; }
.slide-in { animation: slideIn 0.3s ease both; }

button { cursor: pointer; font-family: inherit; }
input, select { font-family: inherit; }
</style>
</head>
<body>
<div id="root"></div>

<script src="data.js"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel">

// ── Icons (inline SVG) ─────────────────────────────────────────────────────
const Icon = ({ name, size=18, color="currentColor" }) => {
  const icons = {
    grid: <><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></>,
    star: <><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></>,
    chart: <><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></>,
    store: <><path d="M6 2 3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></>,
    package: <><line x1="16.5" y1="9.4" x2="7.5" y2="4.21"/><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 002 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></>,
    file: <><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></>,
    bell: <><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></>,
    search: <><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></>,
    chevronRight: <><polyline points="9 18 15 12 9 6"/></>,
    chevronLeft: <><polyline points="15 18 9 12 15 6"/></>,
    chevronDown: <><polyline points="6 9 12 15 18 9"/></>,
    filter: <><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></>,
    arrowUp: <><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></>,
    arrowDown: <><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></>,
    trending: <><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></>,
    zap: <><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></>,
    download: <><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></>,
    refresh: <><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></>,
    settings: <><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></>,
    globe: <><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></>,
    user: <><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></>,
    x: <><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></>,
    eye: <><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></>,
    plus: <><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></>,
    check: <><polyline points="20 6 9 17 4 12"/></>,
    alert: <><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></>,
    map: <><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></>,
    cpu: <><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><line x1="9" y1="1" x2="9" y2="4"/><line x1="15" y1="1" x2="15" y2="4"/><line x1="9" y1="20" x2="9" y2="23"/><line x1="15" y1="20" x2="15" y2="23"/><line x1="20" y1="9" x2="23" y2="9"/><line x1="20" y1="14" x2="23" y2="14"/><line x1="1" y1="9" x2="4" y2="9"/><line x1="1" y1="14" x2="4" y2="14"/></>,
  };
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
      stroke={color} strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round">
      {icons[name] || <circle cx="12" cy="12" r="10"/>}
    </svg>
  );
};

// ── Sidebar ────────────────────────────────────────────────────────────────
const NAV = [
  { id: "suggestions", label: "Suggestions", icon: "star" },
  { id: "dashboard",   label: "Dashboard",   icon: "grid" },
  { id: "analysis",    label: "Analyse Produit", icon: "trending" },
  { id: "stores",      label: "Multi-Stores",    icon: "store" },
  { id: "stock",       label: "Stock IA",         icon: "package" },
  { id: "reports",     label: "Rapports",         icon: "file" },
];

function Sidebar({ page, setPage, collapsed, setCollapsed }) {
  return (
    <div style={{
      width: collapsed ? 60 : 220,
      minWidth: collapsed ? 60 : 220,
      height: "100vh",
      background: "rgba(255,255,255,0.025)",
      borderRight: "1px solid rgba(255,255,255,0.06)",
      display: "flex", flexDirection: "column",
      transition: "width 0.25s cubic-bezier(0.4,0,0.2,1), min-width 0.25s",
      overflow: "hidden",
      zIndex: 100,
    }}>
      {/* Logo */}
      <div style={{ padding: collapsed ? "20px 0" : "20px 20px", display:"flex", alignItems:"center", gap:10, justifyContent: collapsed ? "center":"flex-start" }}>
        <div style={{
          width:32, height:32, borderRadius:8, flexShrink:0,
          background:"linear-gradient(135deg, #6366F1, #3B82F6)",
          display:"flex", alignItems:"center", justifyContent:"center"
        }}>
          <Icon name="cpu" size={16} color="#fff"/>
        </div>
        {!collapsed && <span style={{ fontSize:14, fontWeight:700, color:"#fff", whiteSpace:"nowrap", letterSpacing:"-0.01em" }}>AI Market</span>}
      </div>

      {/* Nav */}
      <nav style={{ flex:1, padding:"8px 8px", display:"flex", flexDirection:"column", gap:2 }}>
        {NAV.map(item => {
          const active = page === item.id;
          return (
            <button key={item.id} onClick={() => setPage(item.id)}
              title={collapsed ? item.label : undefined}
              style={{
                display:"flex", alignItems:"center", gap:10,
                padding: collapsed ? "10px 0" : "10px 12px",
                justifyContent: collapsed ? "center" : "flex-start",
                borderRadius:8, border:"none",
                background: active ? "rgba(99,102,241,0.18)" : "transparent",
                color: active ? "#a5b4fc" : "rgba(255,255,255,0.45)",
                fontSize:13, fontWeight: active ? 600 : 400,
                transition:"all 0.15s",
                cursor:"pointer", whiteSpace:"nowrap", width:"100%",
              }}
              onMouseEnter={e => { if(!active){ e.currentTarget.style.background="rgba(255,255,255,0.05)"; e.currentTarget.style.color="rgba(255,255,255,0.75)"; }}}
              onMouseLeave={e => { if(!active){ e.currentTarget.style.background="transparent"; e.currentTarget.style.color="rgba(255,255,255,0.45)"; }}}
            >
              <Icon name={item.icon} size={16} color={active ? "#a5b4fc" : "currentColor"}/>
              {!collapsed && <span>{item.label}</span>}
              {!collapsed && active && <div style={{ marginLeft:"auto", width:4, height:4, borderRadius:"50%", background:"#6366F1" }}/>}
            </button>
          );
        })}
      </nav>

      {/* Collapse toggle */}
      <div style={{ padding:"12px 8px", borderTop:"1px solid rgba(255,255,255,0.06)" }}>
        <button onClick={() => setCollapsed(c => !c)}
          style={{
            display:"flex", alignItems:"center", justifyContent: collapsed ? "center" : "flex-start",
            gap:8, width:"100%", padding: collapsed ? "8px 0" : "8px 12px",
            border:"none", background:"transparent", color:"rgba(255,255,255,0.3)",
            borderRadius:8, fontSize:12, cursor:"pointer", transition:"color 0.15s"
          }}
          onMouseEnter={e => e.currentTarget.style.color="rgba(255,255,255,0.6)"}
          onMouseLeave={e => e.currentTarget.style.color="rgba(255,255,255,0.3)"}
        >
          <Icon name={collapsed ? "chevronRight" : "chevronLeft"} size={14}/>
          {!collapsed && <span>Réduire</span>}
        </button>
      </div>
    </div>
  );
}

// ── Top Bar ────────────────────────────────────────────────────────────────
function TopBar({ title, subtitle, children }) {
  return (
    <div style={{
      display:"flex", alignItems:"center", justifyContent:"space-between",
      padding:"0 32px", height:60, flexShrink:0,
      borderBottom:"1px solid rgba(255,255,255,0.06)",
      background:"rgba(10,14,26,0.9)", backdropFilter:"blur(8px)",
      position:"sticky", top:0, zIndex:50,
    }}>
      <div>
        <h1 style={{ fontSize:15, fontWeight:600, color:"#fff", letterSpacing:"-0.01em" }}>{title}</h1>
        {subtitle && <p style={{ fontSize:11, color:"rgba(255,255,255,0.35)", marginTop:1 }}>{subtitle}</p>}
      </div>
      <div style={{ display:"flex", alignItems:"center", gap:12 }}>
        {children}
        <button style={{ width:34, height:34, borderRadius:8, border:"1px solid rgba(255,255,255,0.08)", background:"rgba(255,255,255,0.04)", display:"flex", alignItems:"center", justifyContent:"center", color:"rgba(255,255,255,0.45)", cursor:"pointer" }}>
          <Icon name="bell" size={15}/>
        </button>
        <button style={{ width:34, height:34, borderRadius:8, border:"1px solid rgba(255,255,255,0.08)", background:"rgba(255,255,255,0.04)", display:"flex", alignItems:"center", justifyContent:"center", color:"rgba(255,255,255,0.45)", cursor:"pointer" }}>
          <Icon name="settings" size={15}/>
        </button>
        <div style={{ width:32, height:32, borderRadius:"50%", background:"linear-gradient(135deg,#6366F1,#3B82F6)", display:"flex", alignItems:"center", justifyContent:"center" }}>
          <Icon name="user" size={14} color="#fff"/>
        </div>
      </div>
    </div>
  );
}

// ── Filter Bar ────────────────────────────────────────────────────────────
function FilterBar({ filters, values, onChange }) {
  return (
    <div style={{ display:"flex", gap:8, flexWrap:"wrap", alignItems:"center" }}>
      {filters.map(f => (
        <div key={f.key} style={{ position:"relative" }}>
          <select value={values[f.key] || ""} onChange={e => onChange(f.key, e.target.value)}
            style={{
              appearance:"none", background:"rgba(255,255,255,0.05)",
              border:"1px solid rgba(255,255,255,0.09)", borderRadius:8,
              color: values[f.key] ? "rgba(255,255,255,0.87)" : "rgba(255,255,255,0.4)",
              fontSize:12, padding:"6px 28px 6px 12px", cursor:"pointer",
              outline:"none"
            }}>
            <option value="">{f.label}</option>
            {f.options.map(o => <option key={o} value={o}>{o}</option>)}
          </select>
          <div style={{ position:"absolute", right:8, top:"50%", transform:"translateY(-50%)", pointerEvents:"none", color:"rgba(255,255,255,0.35)" }}>
            <Icon name="chevronDown" size={12}/>
          </div>
        </div>
      ))}
    </div>
  );
}

// ── Product Card ──────────────────────────────────────────────────────────
function ProductCard({ product, onAnalyze, style: cardStyle }) {
  const [hovered, setHovered] = React.useState(false);
  const catColors = { Tech:"#3B82F6", Beauté:"#ec4899", Mode:"#f59e0b", Maison:"#22c55e", Sport:"#06b6d4", Papeterie:"#a78bfa", Loisirs:"#f97316" };
  const catColor = catColors[product.category] || "#6366F1";
  return (
    <div
      onMouseEnter={() => setHovered(true)}
      onMouseLeave={() => setHovered(false)}
      style={{
        background: hovered ? "rgba(255,255,255,0.055)" : "rgba(255,255,255,0.03)",
        border: `1px solid ${hovered ? "rgba(99,102,241,0.3)" : "rgba(255,255,255,0.07)"}`,
        borderRadius:16, padding:"20px", display:"flex", flexDirection:"column", gap:14,
        transition:"all 0.2s", cursor:"default", ...cardStyle
      }}>
      {/* Image placeholder */}
      <div style={{
        height:120, borderRadius:10, background:`rgba(255,255,255,0.04)`,
        border:"1px solid rgba(255,255,255,0.06)",
        display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:6,
        position:"relative", overflow:"hidden"
      }}>
        <div style={{
          position:"absolute", inset:0,
          background:`linear-gradient(135deg, ${catColor}18 0%, transparent 60%)`
        }}/>
        <div style={{ width:48, height:48, borderRadius:12, background:`${catColor}22`, display:"flex", alignItems:"center", justifyContent:"center" }}>
          <Icon name={product.category === "Tech" ? "cpu" : product.category === "Beauté" ? "star" : product.category === "Sport" ? "trending" : "package"} size={22} color={catColor}/>
        </div>
        <span style={{ fontSize:10, color:"rgba(255,255,255,0.25)", fontFamily:"'JetBrains Mono',monospace" }}>{product.category}</span>
        <div style={{ position:"absolute", top:10, right:10 }}>
          <Badge type={product.badge}/>
        </div>
      </div>

      {/* Info */}
      <div>
        <h3 style={{ fontSize:13, fontWeight:600, color:"#fff", lineHeight:1.4, marginBottom:4 }}>{product.name}</h3>
        <p style={{ fontSize:11, color:"rgba(255,255,255,0.35)", lineHeight:1.5 }}>{product.description}</p>
      </div>

      {/* Metrics */}
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8 }}>
        {[
          { label:"Prix moyen", value:`€${product.avgPrice}`, mono:true },
          { label:"Marge", value:`${product.margin}%`, color: product.margin > 65 ? "#22c55e" : "#f59e0b" },
          { label:"Tendance", value:product.trend, color:"#22c55e" },
          { label:"Concurrence", value:product.competition, color: product.competition === "Faible" ? "#22c55e" : product.competition === "Moyenne" ? "#f59e0b" : "#ef4444" },
        ].map(m => (
          <div key={m.label} style={{ background:"rgba(255,255,255,0.03)", borderRadius:8, padding:"8px 10px" }}>
            <div style={{ fontSize:10, color:"rgba(255,255,255,0.3)", marginBottom:3 }}>{m.label}</div>
            <div style={{ fontSize:13, fontWeight:600, color: m.color || "rgba(255,255,255,0.87)", fontFamily: m.mono ? "'JetBrains Mono',monospace" : "inherit" }}>{m.value}</div>
          </div>
        ))}
      </div>

      {/* Demand + Score */}
      <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between" }}>
        <div style={{ flex:1, marginRight:12 }}>
          <div style={{ display:"flex", justifyContent:"space-between", marginBottom:5 }}>
            <span style={{ fontSize:11, color:"rgba(255,255,255,0.35)" }}>Demande</span>
            <span style={{ fontSize:11, fontWeight:600, color:"rgba(255,255,255,0.7)", fontFamily:"'JetBrains Mono',monospace" }}>{product.demand}/100</span>
          </div>
          <ProgressBar value={product.demand} color={product.demand >= 85 ? "#22c55e" : product.demand >= 70 ? "#f59e0b" : "#ef4444"}/>
        </div>
        <ScoreRing score={product.score}/>
      </div>

      {/* Sparkline */}
      <div style={{ borderTop:"1px solid rgba(255,255,255,0.05)", paddingTop:10 }}>
        <div style={{ fontSize:10, color:"rgba(255,255,255,0.25)", marginBottom:4 }}>Prix 12 mois</div>
        <Sparkline data={product.priceHistory} color="#6366F1" width={200} height={36}/>
      </div>

      {/* CTA */}
      <button onClick={() => onAnalyze(product)}
        style={{
          width:"100%", padding:"9px 0",
          background: hovered ? "rgba(99,102,241,0.25)" : "rgba(99,102,241,0.12)",
          border:"1px solid rgba(99,102,241,0.3)", borderRadius:8,
          color:"#a5b4fc", fontSize:12, fontWeight:600,
          cursor:"pointer", transition:"all 0.15s",
          display:"flex", alignItems:"center", justifyContent:"center", gap:6
        }}>
        <Icon name="zap" size={13} color="#a5b4fc"/> Analyser ce produit
      </button>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════════════════
// PAGE: SUGGESTIONS PRODUITS
// ══════════════════════════════════════════════════════════════════════════════
function PageSuggestions({ onAnalyze }) {
  const [filters, setFilters] = React.useState({});
  const [search, setSearch] = React.useState("");
  const [loading, setLoading] = React.useState(true);
  const products = window.MOCK_PRODUCTS;

  React.useEffect(() => {
    const t = setTimeout(() => setLoading(false), 900);
    return () => clearTimeout(t);
  }, []);

  const filtered = products.filter(p => {
    if (search && !p.name.toLowerCase().includes(search.toLowerCase()) && !p.category.toLowerCase().includes(search.toLowerCase())) return false;
    if (filters.category && p.category !== filters.category) return false;
    if (filters.badge && p.badge !== filters.badge) return false;
    if (filters.competition && p.competition !== filters.competition) return false;
    if (filters.seasonality && p.seasonality !== filters.seasonality) return false;
    return true;
  });

  const badgeMap = { trending:"Trending", bestseller:"Best-seller", opportunity:"Opportunité" };

  return (
    <div style={{ flex:1, display:"flex", flexDirection:"column", overflow:"hidden" }}>
      <TopBar title="Suggestions Produits" subtitle="Produits à fort potentiel — mis à jour en temps réel">
        <div style={{ display:"flex", alignItems:"center", gap:8, background:"rgba(255,255,255,0.04)", border:"1px solid rgba(255,255,255,0.08)", borderRadius:8, padding:"6px 12px" }}>
          <Icon name="search" size={14} color="rgba(255,255,255,0.3)"/>
          <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Rechercher un produit…"
            style={{ background:"none", border:"none", color:"rgba(255,255,255,0.87)", fontSize:12, outline:"none", width:180 }}/>
        </div>
      </TopBar>

      <div style={{ flex:1, overflowY:"auto", padding:"24px 32px" }}>
        {/* Stats summary */}

          <div style={{ padding:"16px 20px", borderBottom:"1px solid rgba(255,255,255,0.06)", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
            <h3 style={{ fontSize:13, fontWeight:600, color:"#fff" }}>Matrice de Performance Produits × Stores</h3>
            <span style={{ fontSize:11, color:"rgba(255,255,255,0.3)" }}>Score 0–100</span>
          </div>
          <div style={{ overflowX:"auto" }}>
            <table style={{ width:"100%", borderCollapse:"collapse", fontSize:12 }}>
              <thead>
                <tr style={{ background:"rgba(255,255,255,0.025)" }}>
                  <th style={{ padding:"10px 16px", textAlign:"left", color:"rgba(255,255,255,0.4)", fontWeight:500, fontSize:11 }}>Produit</th>
                  {["Amazon","Shopify","eBay","WooCommerce"].map(s => (
                    <th key={s} style={{ padding:"10px 16px", textAlign:"center", color:"rgba(255,255,255,0.4)", fontWeight:500, fontSize:11 }}>{s}</th>
                  ))}
                  <th style={{ padding:"10px 16px", textAlign:"center", color:"rgba(255,255,255,0.4)", fontWeight:500, fontSize:11 }}>Meilleur</th>
                </tr>
              </thead>
              <tbody>
                {products.map((p, ri) => {
                  const sc = p.stores;
                  const best = Object.entries(sc).sort((a,b)=>b[1]-a[1])[0][0];
                  const storeKey = { "Amazon":"amazon", "Shopify":"shopify", "eBay":"ebay", "WooCommerce":"woo" };
                  return (
                    <tr key={p.id} style={{ borderTop:"1px solid rgba(255,255,255,0.04)" }}
                      onMouseEnter={e => e.currentTarget.style.background="rgba(255,255,255,0.025)"}
                      onMouseLeave={e => e.currentTarget.style.background="transparent"}>
                      <td style={{ padding:"10px 16px", color:"rgba(255,255,255,0.75)", fontWeight:500 }}>{p.name}</td>
                      {["Amazon","Shopify","eBay","WooCommerce"].map(s => {
                        const val = sc[storeKey[s]];
                        const bg = val >= 85 ? "#22c55e" : val >= 70 ? "#f59e0b" : "#ef4444";
                        return (
                          <td key={s} style={{ padding:"10px 16px", textAlign:"center" }}>
                            <span style={{
                              display:"inline-flex", alignItems:"center", justifyContent:"center",
                              width:36, height:22, borderRadius:6,
                              background:`${bg}18`, color:bg,
                              fontSize:11, fontFamily:"'JetBrains Mono',monospace", fontWeight:600
                            }}>{val}</span>
                          </td>
                        );
                      })}
                      <td style={{ padding:"10px 16px", textAlign:"center" }}>
                        <span style={{ fontSize:11, fontWeight:600, color:"#a5b4fc", textTransform:"capitalize" }}>{best}</span>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>

        {/* Geo Heatmap (simulated) */}
        <div style={{ background:"rgba(255,255,255,0.03)", border:"1px solid rgba(255,255,255,0.07)", borderRadius:16, padding:"20px 24px" }}>
          <h3 style={{ fontSize:13, fontWeight:600, color:"#fff", marginBottom:16 }}>Heatmap Géographique</h3>
          <div style={{ display:"grid", gridTemplateColumns:"repeat(7,1fr)", gap:4 }}>
            {[
              {region:"France",val:92},{region:"Espagne",val:74},{region:"Allemagne",val:85},{region:"Italie",val:68},{region:"UK",val:79},{region:"USA",val:61},{region:"Canada",val:55},
              {region:"Belgique",val:88},{region:"Suisse",val:83},{region:"Portugal",val:64},{region:"Pays-Bas",val:77},{region:"Pologne",val:52},{region:"Mexique",val:45},{region:"Brésil",val:38},
            ].map(r => {
              const intensity = r.val / 100;
              const bg = `rgba(99,102,241,${intensity * 0.7 + 0.1})`;
              return (
                <div key={r.region} title={`${r.region}: ${r.val}`}
                  style={{ borderRadius:8, padding:"10px 6px", background:bg, textAlign:"center", cursor:"default", transition:"transform 0.15s" }}
                  onMouseEnter={e => e.currentTarget.style.transform="scale(1.05)"}
                  onMouseLeave={e => e.currentTarget.style.transform="scale(1)"}>
                  <div style={{ fontSize:10, color:"rgba(255,255,255,0.8)", fontWeight:500, marginBottom:2 }}>{r.region}</div>
                  <div style={{ fontSize:12, fontFamily:"'JetBrains Mono',monospace", color:"#fff", fontWeight:700 }}>{r.val}</div>
                </div>
              );
            })}
          </div>
        </div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════════════════
// PAGE: STOCK IA
// ══════════════════════════════════════════════════════════════════════════════
function PageStock() {
  const products = window.MOCK_PRODUCTS;
  const [filter, setFilter] = React.useState("all");

  const filtered = filter === "all" ? products : products.filter(p => p.color === filter);

  return (
    <div style={{ flex:1, display:"flex", flexDirection:"column", overflow:"hidden" }}>
      <TopBar title="Gestion de Stock Intelligente" subtitle="Recommandations IA — basées sur historique + saisonnalité + tendances">
        <div style={{ display:"flex", gap:4, background:"rgba(255,255,255,0.04)", borderRadius:8, padding:3 }}>
          {[{k:"all",l:"Tous"},{k:"red",l:"🔴 Critique"},{k:"orange",l:"🟠 Attention"},{k:"green",l:"🟢 OK"}].map(f => (
            <button key={f.k} onClick={() => setFilter(f.k)}
              style={{ padding:"4px 10px", borderRadius:6, border:"none", fontSize:11, fontWeight:500,
                background: filter===f.k ? "rgba(99,102,241,0.3)" : "transparent",
                color: filter===f.k ? "#a5b4fc" : "rgba(255,255,255,0.35)", cursor:"pointer" }}>
              {f.l}
            </button>
          ))}
        </div>
      </TopBar>

      <div style={{ flex:1, overflowY:"auto", padding:"24px 32px", display:"flex", flexDirection:"column", gap:16 }}>
        {/* Summary */}
        <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:12 }}>
          {[
            { label:"Ruptures critiques", value: products.filter(p=>p.color==="red").length, icon:"🔴", sub:"Réappro urgent" },
            { label:"Niveaux faibles", value: products.filter(p=>p.color==="orange").length, icon:"🟠", sub:"Surveiller de près" },
            { label:"Stocks sains", value: products.filter(p=>p.color==="green").length, icon:"🟢", sub:"Niveaux optimaux" },
          ].map(s => (
            <div key={s.label} style={{ background:"rgba(255,255,255,0.03)", border:"1px solid rgba(255,255,255,0.07)", borderRadius:14, padding:"16px 20px", display:"flex", alignItems:"center", gap:14 }}>
              <span style={{ fontSize:24 }}>{s.icon}</span>
              <div>
                <div style={{ fontSize:22, fontWeight:700, fontFamily:"'JetBrains Mono',monospace", color:"#fff" }}>{s.value}</div>
                <div style={{ fontSize:11, color:"rgba(255,255,255,0.4)" }}>{s.label}</div>
                <div style={{ fontSize:10, color:"rgba(255,255,255,0.25)" }}>{s.sub}</div>
              </div>
            </div>
          ))}
        </div>

        {/* Table */}
        <div style={{ background:"rgba(255,255,255,0.03)", border:"1px solid rgba(255,255,255,0.07)", borderRadius:16, overflow:"hidden" }}>
          <table style={{ width:"100%", borderCollapse:"collapse", fontSize:12 }}>
            <thead>
              <tr style={{ background:"rgba(255,255,255,0.025)" }}>
                {["Produit","Catégorie","Stock actuel","Stock recommandé","Délai réappro","Tendance","Statut","Action IA"].map(h => (
                  <th key={h} style={{ padding:"10px 14px", textAlign:"left", color:"rgba(255,255,255,0.35)", fontWeight:500, fontSize:10, letterSpacing:"0.04em", textTransform:"uppercase" }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {filtered.map(p => {
                const statusColors = { red:["#ef4444","rgba(239,68,68,0.1)"], orange:["#f59e0b","rgba(245,158,11,0.1)"], green:["#22c55e","rgba(34,197,94,0.1)"] };
                const [sc, sbg] = statusColors[p.color];
                const statusLabel = { red:"Critique", orange:"Attention", green:"Optimal" }[p.color];
                const actionLabel = { red:"Commander maintenant", orange:"Planifier réappro", green:"Maintenir niveau" }[p.color];
                const pct = Math.min(100, (p.stock / p.stockReco) * 100);
                return (
                  <tr key={p.id} style={{ borderTop:"1px solid rgba(255,255,255,0.04)" }}
                    onMouseEnter={e => e.currentTarget.style.background="rgba(255,255,255,0.02)"}
                    onMouseLeave={e => e.currentTarget.style.background="transparent"}>
                    <td style={{ padding:"12px 14px", color:"rgba(255,255,255,0.8)", fontWeight:500, maxWidth:160 }}>
                      <div style={{ overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{p.name}</div>
                    </td>
                    <td style={{ padding:"12px 14px", color:"rgba(255,255,255,0.4)" }}>{p.category}</td>
                    <td style={{ padding:"12px 14px" }}>
                      <div style={{ display:"flex", flexDirection:"column", gap:4 }}>
                        <span style={{ fontFamily:"'JetBrains Mono',monospace", color:sc, fontWeight:600 }}>{p.stock} u.</span>
                        <div style={{ width:70 }}><ProgressBar value={pct} color={sc} height={4}/></div>
                      </div>
                    </td>
                    <td style={{ padding:"12px 14px", fontFamily:"'JetBrains Mono',monospace", color:"rgba(255,255,255,0.6)" }}>{p.stockReco} u.</td>
                    <td style={{ padding:"12px 14px", color:"rgba(255,255,255,0.5)" }}>{p.restock}</td>
                    <td style={{ padding:"12px 14px", color:"#22c55e", fontWeight:600 }}>{p.trend}</td>
                    <td style={{ padding:"12px 14px" }}>
                      <span style={{ padding:"3px 8px", borderRadius:6, background:sbg, color:sc, fontSize:10, fontWeight:600 }}>{statusLabel}</span>
                    </td>
                    <td style={{ padding:"12px 14px" }}>
                      <button style={{
                        padding:"5px 10px", borderRadius:6, border:`1px solid ${sc}44`,
                        background:`${sc}12`, color:sc, fontSize:10, fontWeight:600, cursor:"pointer",
                        whiteSpace:"nowrap"
                      }}>{actionLabel}</button>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// PAGE: RAPPORTS
// ══════════════════════════════════════════════════════════════════════════════
function PageReports() {
  const [generating, setGenerating] = React.useState(null);
  const [done, setDone] = React.useState({});
  const reports = window.MOCK_REPORTS;

  const handleGen = (id) => {
    setGenerating(id);
    setTimeout(() => { setGenerating(null); setDone(d => ({...d, [id]:true})); setTimeout(() => setDone(d => ({...d, [id]:false})), 2500); }, 1800);
  };

  const templates = [
    { name:"Analyse Hebdomadaire", desc:"Top produits, alertes, KPIs", icon:"📊" },
    { name:"Performance Stores", desc:"Comparatif multi-plateformes", icon:"🏪" },
    { name:"Rapport Stock Critique", desc:"Alertes et recommandations", icon:"📦" },
    { name:"Tendances Marché", desc:"Évolutions et prédictions IA", icon:"📈" },
  ];

  return (
    <div style={{ flex:1, display:"flex", flexDirection:"column", overflow:"hidden" }}>
      <TopBar title="Rapports & Exports" subtitle="Génération de rapports PDF/Excel personnalisables">
        <button style={{ display:"flex", alignItems:"center", gap:6, padding:"7px 14px", borderRadius:8, border:"1px solid rgba(99,102,241,0.35)", background:"rgba(99,102,241,0.15)", color:"#a5b4fc", fontSize:12, fontWeight:600, cursor:"pointer" }}>
          <Icon name="plus" size={13}/> Nouveau rapport
        </button>
      </TopBar>

      <div style={{ flex:1, overflowY:"auto", padding:"24px 32px", display:"flex", flexDirection:"column", gap:20 }}>
        {/* Schedule summary */}
        <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:12 }}>
          {[
            { label:"Rapports programmés", value:"6", icon:"🗓️", next:"Prochain: Lun 05 Mai" },
            { label:"Exportés ce mois", value:"24", icon:"📤", next:"+8 vs mois dernier" },
            { label:"Templates actifs", value:"4", icon:"📋", next:"2 PDF · 2 Excel" },
          ].map(s => (
            <div key={s.label} style={{ background:"rgba(255,255,255,0.03)", border:"1px solid rgba(255,255,255,0.07)", borderRadius:14, padding:"16px 20px" }}>
              <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:8 }}>
                <span style={{ fontSize:20 }}>{s.icon}</span>
                <span style={{ fontSize:22, fontWeight:700, fontFamily:"'JetBrains Mono',monospace", color:"#fff" }}>{s.value}</span>
              </div>
              <div style={{ fontSize:11, color:"rgba(255,255,255,0.45)" }}>{s.label}</div>
              <div style={{ fontSize:10, color:"rgba(255,255,255,0.25)", marginTop:3 }}>{s.next}</div>
            </div>
          ))}
        </div>

        {/* Templates */}
        <div>
          <h3 style={{ fontSize:13, fontWeight:600, color:"rgba(255,255,255,0.6)", marginBottom:12, letterSpacing:"0.04em", textTransform:"uppercase", fontSize:11 }}>Templates Prédéfinis</h3>
          <div style={{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:10 }}>
            {templates.map(t => (
              <div key={t.name} style={{
                background:"rgba(255,255,255,0.03)", border:"1px solid rgba(255,255,255,0.07)",
                borderRadius:12, padding:"16px", cursor:"pointer",
                transition:"all 0.15s"
              }}
              onMouseEnter={e => { e.currentTarget.style.background="rgba(99,102,241,0.08)"; e.currentTarget.style.borderColor="rgba(99,102,241,0.25)"; }}
              onMouseLeave={e => { e.currentTarget.style.background="rgba(255,255,255,0.03)"; e.currentTarget.style.borderColor="rgba(255,255,255,0.07)"; }}>
                <div style={{ fontSize:24, marginBottom:8 }}>{t.icon}</div>
                <div style={{ fontSize:12, fontWeight:600, color:"rgba(255,255,255,0.8)", marginBottom:3 }}>{t.name}</div>
                <div style={{ fontSize:10, color:"rgba(255,255,255,0.3)" }}>{t.desc}</div>
              </div>
            ))}
          </div>
        </div>

        {/* Recent reports */}
        <div>
          <h3 style={{ fontSize:11, fontWeight:600, color:"rgba(255,255,255,0.6)", marginBottom:12, letterSpacing:"0.04em", textTransform:"uppercase" }}>Rapports Récents</h3>
          <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
            {reports.map(r => (
              <div key={r.id} style={{
                display:"flex", alignItems:"center", justifyContent:"space-between",
                background:"rgba(255,255,255,0.03)", border:"1px solid rgba(255,255,255,0.07)",
                borderRadius:12, padding:"14px 18px",
                transition:"all 0.15s"
              }}
              onMouseEnter={e => e.currentTarget.style.background="rgba(255,255,255,0.045)"}
              onMouseLeave={e => e.currentTarget.style.background="rgba(255,255,255,0.03)"}>
                <div style={{ display:"flex", alignItems:"center", gap:12 }}>
                  <div style={{ width:36, height:36, borderRadius:8, background: r.format==="PDF" ? "rgba(239,68,68,0.12)" : "rgba(34,197,94,0.12)", display:"flex", alignItems:"center", justifyContent:"center" }}>
                    <Icon name="file" size={15} color={r.format==="PDF" ? "#f87171" : "#4ade80"}/>
                  </div>
                  <div>
                    <div style={{ fontSize:13, fontWeight:500, color:"rgba(255,255,255,0.85)" }}>{r.name}</div>
                    <div style={{ fontSize:11, color:"rgba(255,255,255,0.3)", marginTop:1 }}>Généré {r.lastRun} · {r.format} · {r.size}</div>
                  </div>
                </div>
                <div style={{ display:"flex", gap:8, alignItems:"center" }}>
                  <button onClick={() => handleGen(r.id)}
                    style={{
                      display:"flex", alignItems:"center", gap:5,
                      padding:"6px 12px", borderRadius:7, border:"1px solid rgba(99,102,241,0.3)",
                      background: generating===r.id ? "rgba(99,102,241,0.25)" : "rgba(99,102,241,0.1)",
                      color: done[r.id] ? "#22c55e" : "#a5b4fc",
                      fontSize:11, fontWeight:600, cursor:"pointer", transition:"all 0.2s"
                    }}>
                    {generating===r.id
                      ? <><Icon name="refresh" size={12}/> Génération…</>
                      : done[r.id]
                        ? <><Icon name="check" size={12}/> Prêt</>
                        : <><Icon name="refresh" size={12}/> Régénérer</>}
                  </button>
                  <button style={{ display:"flex", alignItems:"center", gap:5, padding:"6px 12px", borderRadius:7, border:"1px solid rgba(255,255,255,0.09)", background:"rgba(255,255,255,0.04)", color:"rgba(255,255,255,0.5)", fontSize:11, cursor:"pointer" }}>
                    <Icon name="download" size={12}/> Télécharger
                  </button>
                </div>
              </div>
            ))}
          </div>
        </div>

        {/* Scheduled reports */}
        <div style={{ background:"rgba(255,255,255,0.025)", border:"1px solid rgba(255,255,255,0.06)", borderRadius:14, padding:"18px 20px" }}>
          <h3 style={{ fontSize:11, fontWeight:600, color:"rgba(255,255,255,0.4)", marginBottom:14, letterSpacing:"0.04em", textTransform:"uppercase" }}>Rapports Programmés</h3>
          <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:12 }}>
            {[
              { name:"Rapport Quotidien", freq:"Chaque jour 8h00", next:"Demain 08:00", active:true },
              { name:"Synthèse Hebdo", freq:"Chaque Lundi 9h00", next:"Lun 06 Mai", active:true },
              { name:"Rapport Mensuel", freq:"1er du mois", next:"01 Juin 2026", active:false },
            ].map(s => (
              <div key={s.name} style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"12px 14px", borderRadius:10, background:"rgba(255,255,255,0.025)", border:"1px solid rgba(255,255,255,0.055)" }}>
                <div>
                  <div style={{ fontSize:12, fontWeight:500, color:"rgba(255,255,255,0.75)" }}>{s.name}</div>
                  <div style={{ fontSize:10, color:"rgba(255,255,255,0.3)", marginTop:2 }}>{s.freq}</div>
                  <div style={{ fontSize:10, color:"rgba(255,255,255,0.2)", marginTop:1 }}>Prochain: {s.next}</div>
                </div>
                <div style={{ width:32, height:18, borderRadius:9, background: s.active ? "rgba(34,197,94,0.25)" : "rgba(255,255,255,0.08)", border: `1px solid ${s.active ? "rgba(34,197,94,0.4)" : "rgba(255,255,255,0.1)"}`, position:"relative", cursor:"pointer", flexShrink:0 }}>
                  <div style={{ position:"absolute", width:14, height:14, borderRadius:"50%", background: s.active ? "#22c55e" : "rgba(255,255,255,0.3)", top:1, left: s.active ? 16 : 1, transition:"left 0.2s" }}/>
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════════════════
// TWEAK DEFAULTS
// ══════════════════════════════════════════════════════════════════════════════
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accentColor": "#6366F1",
  "secondaryColor": "#3B82F6",
  "positiveColor": "#22c55e",
  "density": "comfortable",
  "sidebarCollapsed": false,
  "defaultPage": "suggestions"
}/*EDITMODE-END*/;

// ══════════════════════════════════════════════════════════════════════════════
// APP ROOT
// ══════════════════════════════════════════════════════════════════════════════
function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [page, setPage] = React.useState(tweaks.defaultPage || "suggestions");
  const [collapsed, setCollapsed] = React.useState(tweaks.sidebarCollapsed);
  const [selectedProduct, setSelectedProduct] = React.useState(null);

  const handleAnalyze = (product) => {
    setSelectedProduct(product);
    setPage("analysis");
  };

  const pageContent = React.useMemo(() => {
    switch(page) {
      case "suggestions": return <PageSuggestions onAnalyze={handleAnalyze}/>;
      case "dashboard":   return <PageDashboard onAnalyze={handleAnalyze}/>;
      case "analysis":    return <PageAnalysis selectedProduct={selectedProduct}/>;
      case "stores":      return <PageStores/>;
      case "stock":       return <PageStock/>;
      case "reports":     return <PageReports/>;
      default:            return <PageSuggestions onAnalyze={handleAnalyze}/>;
    }
  }, [page, selectedProduct]);

  return (
    <>
      <style>{`
        :root {
          --accent: ${tweaks.accentColor};
          --accent2: ${tweaks.secondaryColor};
          --positive: ${tweaks.positiveColor};
        }
        .fade-up { animation: fadeUp 0.4s ease both; }
      `}</style>

      <Sidebar page={page} setPage={setPage} collapsed={collapsed} setCollapsed={setCollapsed}/>
      <div style={{ flex:1, display:"flex", flexDirection:"column", overflow:"hidden", minWidth:0 }}>
        {pageContent}
      </div>

      <TweaksPanel>
        <TweakSection label="Couleurs"/>
        <TweakColor label="Couleur Accent" value={tweaks.accentColor} onChange={v => setTweak("accentColor", v)}/>
        <TweakColor label="Couleur Secondaire" value={tweaks.secondaryColor} onChange={v => setTweak("secondaryColor", v)}/>
        <TweakColor label="Indicateur Positif" value={tweaks.positiveColor} onChange={v => setTweak("positiveColor", v)}/>
        <TweakSection label="Navigation"/>
        <TweakToggle label="Sidebar réduite" value={collapsed} onChange={v => { setTweak("sidebarCollapsed", v); setCollapsed(v); }}/>
        <TweakSelect label="Page par défaut" value={tweaks.defaultPage}
          options={["suggestions","dashboard","analysis","stores","stock","reports"]}
          onChange={v => { setTweak("defaultPage", v); setPage(v); }}/>
        <TweakSection label="Affichage"/>
        <TweakRadio label="Densité" value={tweaks.density} options={["compact","comfortable","spacious"]} onChange={v => setTweak("density", v)}/>
      </TweaksPanel>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
